[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "configflare"
version = "1.0.0"
description = "Audit MCP and coding-agent configuration before it becomes an incident."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "ai-agents", "security", "configuration", "cli"]

[project.scripts]
configflare = "configflare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
